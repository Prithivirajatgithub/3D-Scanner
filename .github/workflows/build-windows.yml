name: Build and Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118
          pip install PySide6 open3d pyqtgraph PyOpenGL pyrealsense2 opencv-python pyinstaller

      - name: Package Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "VirtuaScan" `
            --icon "gui/icon.ico" `
            --add-data "gui;gui" `
            --add-data "src;src" `
            --add-data "scripts;scripts" `
            --collect-all open3d `
            --collect-all pyqtgraph `
            gui/app.py

      - name: Clean Unused Large Blobs & Compress Archive
        shell: pwsh
        run: |
          # Remove heavy test files and static libraries from PyTorch bundle
          Get-ChildItem -Path "dist/VirtuaScan" -Recurse -Include "*.lib", "*.pdb", "test", "tests" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          
          # Use 7-Zip with standard Zip format and high compression to stay well under 2GB
          7z a -tzip -mx=7 VirtuaScan-v1.0.0-Windows-x64.zip ./dist/VirtuaScan

      - name: Create GitHub Release & Upload Binary
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "VirtuaScan v1.0.0 - Windows Release"
          prerelease: true
          files: VirtuaScan-v1.0.0-Windows-x64.zip
          body: |
            ### VirtuaScan v1.0.0 (Beta Preview)

            **VirtuaScan** is a standalone, real-time 3D surface scanning and reconstruction suite built with Open3D and PyTorch. This initial Windows build is currently in the **testing / pre-release stage**.

            ---

            ### Hardware Compatibility & Testing
            * **Supported Cameras:** Intel RealSense Depth Cameras (D400 series).
            * **Validated Device:** Actively benchmarked and verified with the **Intel RealSense D456**.
            * **Interface:** USB 3.0 / 3.2 Gen 1 (High-speed port required for full-bandwidth RGB-D stream).

            ---

            ### Prerequisites Before Running
            To ensure hardware communication and GPU acceleration on Windows, please install:
            1. **[Intel RealSense SDK 2.0](https://github.com/IntelRealSense/librealsense/releases)** (Required for UVC/Depth drivers).
            2. **[Microsoft Visual C++ 2015–2022 Redistributable (x64)](https://aka.ms/vs/17/release/vc_redist.x64.exe)**.
            3. **NVIDIA GPU Driver** (Recommended for accelerated TSDF / CUDA pipeline).

            ---

            ### Quick Start
            1. Download and extract `VirtuaScan-v1.0.0-Windows-x64.zip`.
            2. Connect your Intel RealSense camera to a USB 3.0 port.
            3. Run `VirtuaScan.exe` inside the extracted folder.
